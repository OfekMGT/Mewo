<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat Pop Party</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sky-glow"></div>
    <div class="stars" aria-hidden="true"></div>

    <main class="app">
      <header class="hero">
        <p class="eyebrow">MEOW MODE</p>
        <h1>Cat Pop Party</h1>
        <p class="subtitle">Tap every cat before they scatter.</p>
      </header>

      <div id="scene" aria-live="polite" aria-label="Cat popping game area"></div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
